<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan Bahasa Indonesia Kelas 4</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#2b2a33;--mut:#6b6880;--pri:#4f46e5;--pri-ink:#fff;--line:#e6dfcf;--sel:#e0e7ff;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a24;--card:#262535;--ink:#f1f0f7;--mut:#a9a6c0;--pri:#8b85ff;--pri-ink:#16151f;--line:#3a3950;--sel:#34336b}}
:root[data-theme="dark"]{--bg:#1b1a24;--card:#262535;--ink:#f1f0f7;--mut:#a9a6c0;--pri:#8b85ff;--pri-ink:#16151f;--line:#3a3950;--sel:#34336b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 20px/1.55 Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:820px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:34px;margin:8px 0 4px;line-height:1.2}.mut{color:var(--mut);margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:130px}
.card .num{width:40px;height:40px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-weight:800}
.card b{font-size:21px;line-height:1.3}.card small{color:var(--mut)}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;margin-top:6px}
.sticky .row{display:flex;justify-content:space-between;font-weight:800}
.bar{height:12px;background:var(--line);border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
h2{font-size:26px;margin:34px 0 6px;padding-top:14px;border-top:3px dashed var(--line)}
.qb{margin:18px 0 26px}.qn{color:var(--mut);font-weight:800;font-size:17px}
.pass{background:var(--card);border-left:6px solid var(--pri);border-radius:14px;padding:6px 18px;margin:14px 0;font-size:19px}
.q{font-size:22px;font-weight:800;margin:2px 0 12px;line-height:1.4}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 10px;min-height:62px}
.opt b{flex:none;width:36px;height:36px;border-radius:50%;background:var(--line);display:grid;place-items:center}
.opt.on{background:var(--sel);border-color:var(--pri)}.opt.on b{background:var(--pri);color:var(--pri-ink)}
.tf{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px 14px}
.th,.tr{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;padding:10px 0}
.th{text-align:center;font-size:17px}.tr{border-top:1px solid var(--line)}
.pick{height:56px;border:2px solid var(--line);border-radius:14px;background:var(--bg);font-size:26px;font-weight:800}
.pick.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:16px;padding:16px 26px;font-weight:800;font-size:21px;min-height:60px}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--line)}.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;padding-top:20px}.big{font-size:72px;font-weight:800;margin:6px 0;line-height:1.1}.stars{font-size:46px;letter-spacing:6px}
</style></head><body><div id="app"></div>
<script>
const D=[{"id": 1, "t": "Menyampaikan Pendapat", "q": [{"n": 1, "t": "Apa yang perlu dilakukan saat menyampaikan pendapat?", "y": "c", "o": ["Menyampaikan pendapat dengan sopan dan menyertakan alasan.", "Memaksakan pendapat kepada teman.", "Berbicara keras agar semua orang takut.", "Mengejek pendapat orang lain."]}, {"n": 2, "t": "Kalimat manakah yang menunjukkan sikap tidak setuju dengan sopan?", "y": "c", "o": ["Pendapatmu pasti salah!", "Aku tidak setuju. Menurutku, lebih baik kita menjadi penonton.", "Kamu tidak boleh berbicara!", "Pokoknya kita harus mengikuti pendapatku!"]}]}, {"id": 2, "t": "Menentukan Isi Pendapat", "q": [{"n": 1, "t": "Apa arti kata “mending” pada kalimat “Aku tidak setuju. Mending kita jadi penonton.”?", "y": "c", "o": ["Lebih baik", "Lebih cepat", "Lebih jauh", "Lebih ramai"]}, {"n": 2, "t": "Mengapa kita perlu menyertakan alasan saat menyampaikan pendapat?", "y": "c", "o": ["Agar orang lain memahami alasan dari pendapat kita.", "Agar pendapat kita selalu menang.", "Agar teman tidak boleh berbeda pendapat.", "Agar kita dapat mengejek pendapat orang lain."]}]}, {"id": 3, "t": "Seluk-beluk Teks Argumentasi", "q": [{"n": 1, "t": "Apa yang dimaksud dengan argumen?", "y": "c", "o": ["Alasan yang digunakan untuk memperkuat atau menolak pendapat.", "Cerita khayalan tentang suatu peristiwa.", "Daftar nama tokoh dalam cerita.", "Kalimat yang hanya berisi pertanyaan."]}, {"n": 2, "t": "Alasan dalam teks argumentasi sebaiknya berdasarkan ....", "y": "c", "o": ["Tebakan saja.", "Fakta atau data.", "Keinginan penulis tanpa bukti.", "Pendapat yang tidak jelas."]}, {"n": 3, "t": "Salah satu tujuan teks argumentasi adalah ....", "y": "c", "o": ["Membuat pembaca lupa pada suatu masalah.", "Menghibur pembaca dengan cerita lucu saja.", "Memengaruhi perilaku pembaca.", "Menggambarkan bentuk suatu benda saja."]}, {"n": 4, "t": "Manakah yang termasuk ciri teks argumentasi?", "y": "c", "o": ["Tidak memiliki gagasan atau ide.", "Berisi fakta untuk mendukung pendapat.", "Semua paragraf harus berupa percakapan.", "Tidak membutuhkan alasan atau bukti."]}]}, {"id": 4, "t": "Fakta dan Opini", "q": [{"n": 1, "t": "Menurut teks, berapa persen orang Indonesia yang berolahraga pada tahun 2022 berdasarkan laporan Kemenpora?", "y": "c", "o": ["20,93%", "30,93%", "40,93%", "50,93%"], "p": "<p><b>Olahraga Kunci Tubuh Sehat</b></p><p>Banyak orang menganggap remeh kegiatan berolahraga. Padahal, berolahraga penting untuk menjaga kesehatan. Menurut laporan Kementerian Pemuda dan Olahraga (Kemenpora), baru 30,93% orang Indonesia yang berolahraga pada tahun 2022.</p><p>Berolahraga membuat tubuh menjadi bugar. Saat berlari, bermain sepak bola, atau bersepeda, otot-otot tubuh tumbuh lebih besar dan kuat. Selain itu, saat berolahraga tubuh mengeluarkan keringat. Keringat membantu menjaga kesehatan jantung dan memperlancar sirkulasi darah. Berolahraga juga dapat memberikan energi positif. Berolahraga akan makin menyenangkan jika dilakukan bersama teman dan keluarga.</p><p>Jadi, mari biasakan berolahraga. Berolahraga membuat tubuh menjadi kuat dan sehat. Jangan lupa berolahraga secara teratur!</p><p><i>Sumber: Anis Irmawati/Universitas Airlangga (2024)</i></p>"}, {"n": 2, "t": "Kalimat manakah yang merupakan opini dalam teks “Olahraga Kunci Tubuh Sehat”?", "y": "c", "o": ["Pada tahun 2022, 30,93% orang Indonesia berolahraga.", "Saat berolahraga, tubuh mengeluarkan keringat.", "Berolahraga akan makin menyenangkan jika dilakukan bersama teman dan keluarga.", "Otot-otot tubuh dapat tumbuh lebih besar dan kuat saat berolahraga."], "p": "<p><b>Olahraga Kunci Tubuh Sehat</b></p><p>Banyak orang menganggap remeh kegiatan berolahraga. Padahal, berolahraga penting untuk menjaga kesehatan. Menurut laporan Kementerian Pemuda dan Olahraga (Kemenpora), baru 30,93% orang Indonesia yang berolahraga pada tahun 2022.</p><p>Berolahraga membuat tubuh menjadi bugar. Saat berlari, bermain sepak bola, atau bersepeda, otot-otot tubuh tumbuh lebih besar dan kuat. Selain itu, saat berolahraga tubuh mengeluarkan keringat. Keringat membantu menjaga kesehatan jantung dan memperlancar sirkulasi darah. Berolahraga juga dapat memberikan energi positif. Berolahraga akan makin menyenangkan jika dilakukan bersama teman dan keluarga.</p><p>Jadi, mari biasakan berolahraga. Berolahraga membuat tubuh menjadi kuat dan sehat. Jangan lupa berolahraga secara teratur!</p><p><i>Sumber: Anis Irmawati/Universitas Airlangga (2024)</i></p>"}]}, {"id": 5, "t": "Arti Fakta dan Opini", "q": [{"n": 1, "t": "Apakah yang dimaksud dengan fakta?", "y": "c", "o": ["Pendapat seseorang tentang suatu hal.", "Keadaan atau peristiwa yang benar-benar terjadi.", "Keinginan yang belum tentu terwujud.", "Cerita khayalan yang dibuat seseorang."]}, {"n": 2, "t": "Apakah yang dimaksud dengan opini?", "y": "c", "o": ["Peristiwa yang sudah terbukti terjadi.", "Informasi yang selalu berisi angka.", "Pendapat atau pandangan seseorang terhadap suatu hal.", "Kejadian yang dapat dilihat semua orang."]}]}, {"id": 6, "t": "Gagasan Pokok dan Gagasan Pendukung", "q": [{"n": 1, "t": "Apa yang dimaksud dengan gagasan pokok?", "y": "c", "o": ["Ide utama yang hendak disampaikan penulis.", "Contoh yang melengkapi sebuah gagasan.", "Kalimat yang tidak berhubungan dengan paragraf.", "Judul buku yang ditulis penulis."]}, {"n": 2, "t": "Apa yang dimaksud dengan gagasan pendukung?", "y": "c", "o": ["Ide utama dalam sebuah teks.", "Gagasan yang melengkapi gagasan pokok.", "Kalimat pertama pada setiap paragraf.", "Kesimpulan dari seluruh buku."]}, {"n": 3, "t": "Gagasan pokok biasanya terdapat di ....", "y": "c", "o": ["Tengah halaman saja.", "Judul buku saja.", "Awal atau akhir kalimat.", "Daftar isi."]}, {"n": 4, "t": "Manakah ciri gagasan pokok?", "y": "c", "o": ["Bersifat khusus.", "Berupa contoh saja.", "Dalam satu paragraf harus ada banyak gagasan pokok.", "Bersifat umum."]}, {"n": 5, "t": "Manakah ciri gagasan pendukung?", "y": "c", "o": ["Bersifat khusus.", "Selalu menjadi judul paragraf.", "Dapat berdiri sendiri jika kalimat lain dihilangkan.", "Hanya terdapat satu dalam setiap paragraf."]}, {"n": 6, "t": "Mengapa gagasan pokok dan gagasan pendukung sebaiknya ditentukan sebelum menulis teks argumentasi?", "y": "c", "o": ["Agar teks menjadi lebih panjang.", "Agar penulis tidak perlu membuat paragraf.", "Agar menulis teks argumentasi menjadi lebih mudah.", "Agar tidak perlu membaca kembali tulisan."]}]}, {"id": 7, "t": "Struktur dan Langkah Menulis Teks Argumentasi", "q": [{"n": 1, "t": "Struktur teks argumentasi yang berisi topik yang akan dibahas dan berfungsi sebagai pembuka teks disebut ....", "y": "c", "o": ["Kesimpulan", "Pendahuluan (tesis)", "Tubuh argumen", "Daftar pustaka"]}, {"n": 2, "t": "Bagian tubuh argumen berisi ....", "y": "c", "o": ["Tanggapan penulis terhadap topik, baik setuju maupun tidak setuju", "Nama penulis dan judul buku", "Hanya salam pembuka", "Daftar tokoh dalam cerita"]}, {"n": 3, "t": "Apa isi bagian kesimpulan dalam teks argumentasi?", "y": "c", "o": ["Topik baru yang tidak berhubungan", "Kumpulan pertanyaan", "Saran atau harapan untuk mengatasi masalah", "Daftar bahan tulisan"]}, {"n": 4, "t": "Langkah pertama dalam menulis teks argumentasi adalah ....", "y": "c", "o": ["Membuat kesimpulan", "Mengembangkan tubuh argumen", "Mengumpulkan data", "Menentukan tema atau topik"]}, {"n": 5, "t": "Setelah mengumpulkan data sebagai bahan tulisan dan membuat kerangka teks, langkah berikutnya adalah ....", "y": "c", "o": ["Mengembangkan pendahuluan dan tubuh argumen", "Mengganti tema dengan topik lain", "Langsung menghapus tulisan", "Membuat daftar tokoh"]}]}, {"id": 8, "t": "Asesmen Akhir Bab", "q": [{"n": 1, "t": "Kalimat pendapat yang menyatakan setuju diucapkan oleh ....", "y": "c", "o": ["Ale", "Ana", "Romi", "Kai"], "p": "<p>Ale mengajak teman-temannya pergi berlibur, ”Aku punya ide. Liburan kali ini kita pergi ke pantai saja!” ucap Ale bersemangat.</p><p>”Wah, seru sekali. Aku ikut! Di pantai kita bisa berenang dan bermain voli,” sahut Ana.</p><p>”Menurutku, itu bukan ide bagus. Sekarang masih musim hujan. Lebih baik kita liburan ke tempat yang lebih aman.” Kali ini Romi yang menyahut.</p><p>”Kalau begitu kita perlu memikirkan ulang tujuan liburan kali ini,” ujar Kai menengahi teman-temannya.</p>"}, {"n": 2, "t": "Tentukan Benar atau Salah untuk setiap pernyataan berdasarkan cerita tersebut!", "y": "t", "o": ["Ale adalah orang yang pertama kali mengajak berlibur ke pantai.", "Romi menolak ide Ale untuk berlibur ke pantai karena cuaca sedang aman.", "Kai mengusulkan agar mereka tetap pergi ke pantai meskipun sedang musim hujan."], "p": "<p>Ale mengajak teman-temannya pergi berlibur, ”Aku punya ide. Liburan kali ini kita pergi ke pantai saja!” ucap Ale bersemangat.</p><p>”Wah, seru sekali. Aku ikut! Di pantai kita bisa berenang dan bermain voli,” sahut Ana.</p><p>”Menurutku, itu bukan ide bagus. Sekarang masih musim hujan. Lebih baik kita liburan ke tempat yang lebih aman.” Kali ini Romi yang menyahut.</p><p>”Kalau begitu kita perlu memikirkan ulang tujuan liburan kali ini,” ujar Kai menengahi teman-temannya.</p>", "h": ["Benar", "Salah"]}, {"n": 3, "t": "Alasan yang diucapkan Romi untuk memperkuat pendapatnya adalah ....", "y": "c", "o": ["Liburan ke pantai tidak cocok pada musim hujan.", "Romi ingin pergi liburan ke tempat lain.", "Liburan di pantai tidak menyenangkan.", "Lokasi pantai sangat jauh dari rumah."], "p": "<p>Ale mengajak teman-temannya pergi berlibur, ”Aku punya ide. Liburan kali ini kita pergi ke pantai saja!” ucap Ale bersemangat.</p><p>”Wah, seru sekali. Aku ikut! Di pantai kita bisa berenang dan bermain voli,” sahut Ana.</p><p>”Menurutku, itu bukan ide bagus. Sekarang masih musim hujan. Lebih baik kita liburan ke tempat yang lebih aman.” Kali ini Romi yang menyahut.</p><p>”Kalau begitu kita perlu memikirkan ulang tujuan liburan kali ini,” ujar Kai menengahi teman-temannya.</p>"}, {"n": 4, "t": "Manakah pendapat yang menyetujui isi teks tersebut?", "y": "m", "o": ["Jangan menunggu sakit untuk mulai berolahraga secara rutin.", "Pemeriksaan kesehatan rutin semestinya menjadi agenda wajib.", "Pemeriksaan kesehatan rutin perlu dilakukan untuk mengetahui kondisi badan."], "p": "<p>Melakukan pemeriksaan kesehatan berkala sangat penting dilakukan. Kita dapat mengetahui kondisi tubuh dengan melakukan pemeriksaan rutin. Apabila tubuh dalam kondisi tidak fit atau muncul gejala sakit, kita dapat mengantisipasi lebih awal.</p>"}, {"n": 5, "t": "Sanggahan yang tepat untuk menolak pendapat tersebut adalah ....", "y": "c", "o": ["Menurut saya, pemeriksaan kesehatan rutin belum tentu mampu mengantisipasi gejala sakit lebih awal.", "Saya kurang sependapat karena pemeriksaan rutin bisa memicu kecemasan berlebihan pada pasien.", "Pemeriksaan kesehatan hanya dianjurkan untuk orang yang punya masalah kesehatan tertentu saja.", "Pemeriksaan kesehatan secara rutin tidak selalu menjadi jalan utama mendeteksi kondisi tubuh."], "p": "<p>Melakukan pemeriksaan kesehatan berkala sangat penting dilakukan. Kita dapat mengetahui kondisi tubuh dengan melakukan pemeriksaan rutin. Apabila tubuh dalam kondisi tidak fit atau muncul gejala sakit, kita dapat mengantisipasi lebih awal.</p>"}, {"n": 6, "t": "Teks tersebut berisi informasi mengenai ....", "y": "c", "o": ["pentingnya melakukan tes kesehatan secara rutin", "manfaat pemeriksaan rutin bagi orang lanjut usia", "pemeriksaan tes kesehatan rutin agar tubuh selalu sehat", "jenis-jenis penyakit yang terdeteksi oleh pemeriksaan kesehatan"], "p": "<p>Melakukan pemeriksaan kesehatan berkala sangat penting dilakukan. Kita dapat mengetahui kondisi tubuh dengan melakukan pemeriksaan rutin. Apabila tubuh dalam kondisi tidak fit atau muncul gejala sakit, kita dapat mengantisipasi lebih awal.</p>"}, {"n": 7, "t": "Pendapat penulis dalam teks tersebut adalah ....", "y": "c", "o": ["Sebanyak 118.143 juta orang menderita kecemasan.", "Sebanyak 13 juta orang di Indonesia melakukan pengecekan kesehatan jiwa.", "Fenomena ini harus diwaspadai karena mengancam kesehatan mental masyarakat.", "Gangguan kecemasan meliputi rasa ketakutan yang muncul dalam situasi yang tidak berbahaya."], "p": "<p>1) Sebanyak 13 juta orang di Indonesia melakukan pengecekan kesehatan jiwa. 2) Dari pemeriksaan tersebut, sebanyak 118.143 orang mengalami gejala gangguan kecemasan. 3) Fenomena ini harus diwaspadai karena mengancam kesehatan mental masyarakat.</p><p>4) Rasa cemas itu tidak sama dengan gangguan kecemasan. 5) Rasa cemas adalah bentuk perlindungan diri kita dari bahaya. 6) Sementara, gangguan kecemasan meliputi rasa ketakutan yang muncul dalam situasi yang tidak berbahaya.</p><p><i>Sumber: Denisa Arlinta/Kompas (2025)</i></p>"}, {"n": 8, "t": "Fakta pada teks tersebut terdapat pada kalimat berangka ....", "y": "m", "o": ["1)", "2)", "3)"], "p": "<p>1) Sebanyak 13 juta orang di Indonesia melakukan pengecekan kesehatan jiwa. 2) Dari pemeriksaan tersebut, sebanyak 118.143 orang mengalami gejala gangguan kecemasan. 3) Fenomena ini harus diwaspadai karena mengancam kesehatan mental masyarakat.</p><p>4) Rasa cemas itu tidak sama dengan gangguan kecemasan. 5) Rasa cemas adalah bentuk perlindungan diri kita dari bahaya. 6) Sementara, gangguan kecemasan meliputi rasa ketakutan yang muncul dalam situasi yang tidak berbahaya.</p><p><i>Sumber: Denisa Arlinta/Kompas (2025)</i></p>"}, {"n": 9, "t": "Gagasan pokok paragraf kedua adalah ....", "y": "c", "o": ["Rasa cemas adalah hal yang wajar.", "Rasa cemas tidak sama dengan gangguan kecemasan.", "Rasa cemas wajar dirasakan siapa saja.", "Rasa cemas adalah bentuk perlindungan diri dari bahaya."], "p": "<p>1) Sebanyak 13 juta orang di Indonesia melakukan pengecekan kesehatan jiwa. 2) Dari pemeriksaan tersebut, sebanyak 118.143 orang mengalami gejala gangguan kecemasan. 3) Fenomena ini harus diwaspadai karena mengancam kesehatan mental masyarakat.</p><p>4) Rasa cemas itu tidak sama dengan gangguan kecemasan. 5) Rasa cemas adalah bentuk perlindungan diri kita dari bahaya. 6) Sementara, gangguan kecemasan meliputi rasa ketakutan yang muncul dalam situasi yang tidak berbahaya.</p><p><i>Sumber: Denisa Arlinta/Kompas (2025)</i></p>"}, {"n": 10, "t": "Tentukan Benar atau Salah untuk setiap pernyataan terkait struktur teks argumentasi berikut!", "y": "t", "o": ["Kalimat pertama paragraf pertama merupakan bagian pendahuluan yang berisi pengenalan isu.", "Kalimat ”Penggunaan gawai dapat membantu anak belajar lewat aplikasi edukatif” merupakan bagian tubuh argumen.", "Kalimat ”Batasi waktu bermain gawai, ciptakan kegiatan lain yang seru, dan beri tahu anak tentang dampak negatif bermain gawai secara berlebihan” merupakan bagian simpulan teks argumentasi."], "p": "<p>Penggunaan gawai oleh anak-anak masih menjadi perdebatan banyak orang. Beberapa orang berpendapat bahwa gawai dapat membantu anak belajar. Namun, segelintir orang juga menganggap gawai membawa permasalahan baru bagi anak-anak.</p><p>Penggunaan gawai dapat membantu anak belajar lewat aplikasi edukatif. Namun, terlalu lama bermain gawai juga dapat membuat anak malas untuk bergerak aktif. Orang tua berperan penting untuk mengatur penggunaan gawai anak. Batasi waktu bermain gawai, ciptakan kegiatan lain yang seru. Anak juga perlu diedukasi tentang dampak negatif bermain gawai secara berlebihan. Orang tua perlu memberikan contoh pada anak untuk menggunakan gawai sewajarnya. Jangan sampai kebiasaan bermain gawai mengganggu interaksi sosial anak dengan lingkungan sekitar.</p>", "h": ["Benar", "Salah"]}, {"n": 11, "t": "Gagasan pokok pada paragraf pertama adalah ....", "y": "c", "o": ["Gawai dapat digunakan sebagai media belajar anak.", "Gawai membawa permasalahan baru bagi anak-anak.", "Penggunaan gawai pada anak masih menjadi perdebatan.", "Orang tua perlu mengatur waktu anak menggunakan gawai."], "p": "<p>Penggunaan gawai oleh anak-anak masih menjadi perdebatan banyak orang. Beberapa orang berpendapat bahwa gawai dapat membantu anak belajar. Namun, segelintir orang juga menganggap gawai
